name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      # Non-blocking: docfy-ui (a production dependency) pulls in
      # react-router-dom, which has an open high-severity advisory
      # (GHSA-qwww-vcr4-c8h2, RSC-mode CSRF) with no fix released yet in the
      # 7.x line — the only "fix" npm offers is a 7-minor downgrade, judged
      # riskier than the (low, since this app doesn't use RSC mode) exposure.
      # Accepted and tracked; flip this back to blocking once upstream ships
      # a real patch. --omit=dev also excludes the unrelated
      # semantic-release/tar/brace-expansion chain, which never ships in the
      # published package.
      - name: npm audit (non-blocking — react-router-dom high, no fix available yet)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Test
        run: npm test -- --ci

      - name: Smoke-test the built CLI binary
        run: node dist/cli/index.js --help
