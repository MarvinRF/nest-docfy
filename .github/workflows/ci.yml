name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      # Blocking: production dependencies are clean. --omit=dev excludes the
      # semantic-release/tar/brace-expansion chain, which never ships to consumers.
      # consumer-audit.yml additionally checks what a fresh install of the latest
      # release resolves to, weekly.
      - name: npm audit (production dependencies only)
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Test
        run: npm test -- --ci

      - name: Smoke-test the built CLI binary
        run: node dist/cli/index.js --help
