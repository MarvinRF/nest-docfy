name: docfy PR check (reusable)

# Reusable workflow for consumers of the published `nestjs-docfy` package —
# runs `check`/`coverage` (and, when --entry is available, a breaking-change
# spec diff against the PR's base commit) via `npx`, posting a single
# summary comment. This is the "workflow reusável pra qualquer consumidor"
# half of the PR-bot roadmap item; pr-check.yml (this repo's own workflow)
# instead builds nest-docfy from source, to dogfood unreleased changes.
#
# Usage, in a consumer repo's own workflow:
#
#   jobs:
#     docfy:
#       uses: MarvinRF/nest-docfy/.github/workflows/docfy-pr-check-reusable.yml@v0.19.0
#       with:
#         root: .                      # project root (default: repo root)
#         export-entry: docfy-export.ts # optional: enables the spec diff step
#         min-coverage: 80
#         docfy-version: 0.19.0
#         docfy-ref: v0.19.0
#
# Pin uses/docfy-version/docfy-ref to one release (or uses: to a commit SHA):
# this job holds pull-requests: write in the consumer repo, so @main/latest
# would run whatever lands here next, unreviewed.

on:
  workflow_call:
    inputs:
      root:
        description: 'Project root, relative to the repo root'
        type: string
        default: '.'
      export-entry:
        description: >
          Path (relative to root) to an export entry file (see nest-docfy's
          "CLI: export" docs). Omit to skip the spec-diff step — check/coverage
          don't need it.
        type: string
        default: ''
      min-coverage:
        description: 'Minimum coverage percentage required, fails the job if below'
        type: number
        default: 80
      node-version:
        description: 'Node.js version to run the checks with'
        type: string
        default: '22.x'
      docfy-version:
        description: >
          Exact nestjs-docfy version to run (via npx), e.g. 0.19.0. Required: this job holds
          pull-requests: write, so it must never float to whatever is published next.
        type: string
        required: true
      docfy-ref:
        description: >
          nest-docfy git tag or commit SHA to pull the PR-comment/spec-diff scripts from, e.g.
          v0.19.0. Required for the same reason as docfy-version.
        type: string
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  docfy-check:
    runs-on: ubuntu-latest
    # Inputs reach the shell only through env vars, never interpolated into `run:` scripts.
    env:
      DOCFY_PKG: nestjs-docfy@${{ inputs.docfy-version }}
      DOCFY_ROOT: ${{ inputs.root }}
      DOCFY_EXPORT_ENTRY: ${{ inputs.export-entry }}
      DOCFY_MIN_COVERAGE: ${{ inputs.min-coverage }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - if: inputs.export-entry != ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base-ref

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: MarvinRF/nest-docfy
          ref: ${{ inputs.docfy-ref }}
          path: .docfy-tools

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ inputs.node-version }}

      # Since 0.19 the CLI's build tooling is an optional peer, so npx installs it alongside.
      - name: Prepare the docfy CLI
        run: |
          echo 'docfy() { npx -y -p "$DOCFY_PKG" -p ts-morph@^28 -p commander@^14 -p picocolors@^1 nestjs-docfy "$@"; }' > "$RUNNER_TEMP/docfy.sh"

      - name: Run check
        run: |
          . "$RUNNER_TEMP/docfy.sh"
          docfy check --root "$DOCFY_ROOT" --json > check.json || true

      - name: Run coverage
        run: |
          . "$RUNNER_TEMP/docfy.sh"
          docfy coverage --root "$DOCFY_ROOT" --json --min "$DOCFY_MIN_COVERAGE" > coverage.json || true

      - name: Export spec (PR head)
        if: inputs.export-entry != ''
        run: |
          . "$RUNNER_TEMP/docfy.sh"
          npm ci --prefix "$DOCFY_ROOT"
          docfy export --entry "$DOCFY_EXPORT_ENTRY" --root "$DOCFY_ROOT" --out new-spec.json

      - name: Export spec (PR base)
        if: inputs.export-entry != ''
        run: |
          . "$RUNNER_TEMP/docfy.sh"
          npm ci --prefix "base-ref/$DOCFY_ROOT"
          docfy export --entry "$DOCFY_EXPORT_ENTRY" --root "base-ref/$DOCFY_ROOT" --out old-spec.json

      - name: Diff specs
        if: inputs.export-entry != ''
        env:
          OLD_SPEC_PATH: old-spec.json
          NEW_SPEC_PATH: new-spec.json
          DIFF_JSON_PATH: diff.json
        run: |
          npm install --no-save docfy-core
          node .docfy-tools/.github/scripts/spec-diff.mjs || true

      - name: Comment on PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CHECK_JSON_PATH: check.json
          COVERAGE_JSON_PATH: coverage.json
          DIFF_JSON_PATH: diff.json
        run: node .docfy-tools/.github/scripts/pr-comment.mjs

      - name: Fail the job if check or coverage did not pass
        run: |
          node -e "
            const check = require('./check.json');
            const coverage = require('./coverage.json');
            if (!check.passed || !coverage.passed) {
              console.error('check.passed:', check.passed, '/ coverage.passed:', coverage.passed);
              process.exit(1);
            }
          "
